<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#312648"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Odd Little Town"><link rel="icon" href="icon.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="icon.png"><title>Odd Little Town</title>
<style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#312648;background:#f8eef8}*{box-sizing:border-box}body{margin:0;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}button,input,select{font:inherit}button{border:2px solid #312648;border-radius:13px;background:#fff5d8;color:#312648;font-weight:750;padding:10px 12px;box-shadow:0 3px 0 #312648;touch-action:manipulation}button:active{transform:translateY(2px);box-shadow:0 1px 0 #312648}button:disabled{opacity:.48}header{background:#312648;color:white;padding:10px 14px;display:flex;justify-content:space-between;align-items:center;gap:10px}header strong{font-size:18px}header button{font-size:13px;padding:6px 9px}main{max-width:550px;margin:auto;padding:10px}#status{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}#status span{background:white;border-radius:20px;padding:5px 9px;font-size:13px;font-weight:700}#canvasWrap{background:#312648;border:5px solid #312648;border-radius:17px;overflow:hidden;position:relative}canvas{display:block;width:100%;height:auto;image-rendering:pixelated;touch-action:manipulation}#place{background:#e6d2eb;border-radius:12px;margin:8px 0;padding:9px 12px;font-size:14px;min-height:39px}#controls{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;max-width:280px;margin:8px auto}#controls button{font-size:21px;padding:7px}#controls .blank{visibility:hidden}#controls .enter{font-size:13px;background:#b6e7d2}#toolbar{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}#toolbar button{font-size:13px;padding:8px}#hint{font-size:12px;text-align:center;opacity:.8;margin:10px 0}#overlay{position:fixed;inset:0;background:#1c1429bb;z-index:5;display:none;align-items:center;justify-content:center;padding:12px}#overlay.show{display:flex}.panel{background:#fff9f0;border:3px solid #312648;border-radius:20px;max-width:520px;width:100%;max-height:87dvh;overflow:auto;padding:17px;box-shadow:0 7px 0 #1f172c}.panel h2{margin:0 36px 9px 0}.panel p{line-height:1.35}.close{float:right;background:#f5b7c9;padding:5px 10px}.options{display:grid;gap:8px}.option{text-align:left;background:white;width:100%;line-height:1.25}.option small{display:block;font-weight:500;opacity:.8;margin-top:3px}.pill{border-radius:12px;background:#eee0ee;padding:9px;margin:8px 0}.notice{background:#c7ecdb;border:2px solid #312648;border-radius:10px;padding:8px;margin:8px 0}.swatches{display:flex;gap:7px;flex-wrap:wrap}.swatches button{width:38px;height:38px;padding:0}.avatar{display:flex;align-items:center;justify-content:center;border:3px solid #312648;border-radius:16px;background:#dcc9e9;min-height:130px;font-size:76px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.muted{opacity:.7;font-size:13px}.card{border:2px solid #8d729a;border-radius:12px;padding:9px;margin:7px 0;background:white}input[type=text]{width:100%;padding:11px;border:2px solid #312648;border-radius:10px}.tabs{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:10px}.tabs button{font-size:12px;padding:6px}a{color:#5c3d78}
</style></head><body>
<header><strong>🌙 Odd Little Town</strong><button id="menuButton">☰ Menu</button></header><main><div id="status"></div><div id="canvasWrap"><canvas id="map" width="480" height="480" aria-label="Town map"></canvas></div><div id="place"></div><div id="controls"><span class="blank"></span><button data-dir="up" aria-label="Move up">▲</button><span class="blank"></span><button data-dir="left" aria-label="Move left">◀</button><button class="enter" id="enter">ENTER</button><button data-dir="right" aria-label="Move right">▶</button><span class="blank"></span><button data-dir="down" aria-label="Move down">▼</button><span class="blank"></span></div><div id="toolbar"><button data-panel="character">🧍 Character</button><button data-panel="room">🏠 Room</button><button data-panel="collection">📖 Collection</button><button data-panel="goals">⭐ Goals</button></div><p id="hint">Move onto a building, then tap ENTER. Walking uses no game time.</p></main><div id="overlay" role="dialog" aria-modal="true"><div class="panel"><button class="close" id="close" aria-label="Close">✕</button><div id="panelBody"></div></div></div>
<script>
'use strict';
const KEY='odd-little-town-save-v1', C=document.getElementById('map'), X=C.getContext('2d'), N=12, T=40;
const buildings=[
 {id:'home',name:'Your Room',icon:'🏠',x:1,y:1,color:'#eaa4b8'},
 {id:'square',name:'Town Square',icon:'🎪',x:5,y:1,color:'#f6c981'},
 {id:'school',name:'Curious School',icon:'📚',x:9,y:1,color:'#b3d9e5'},
 {id:'shop',name:'Oddities Shop',icon:'🛍️',x:1,y:5,color:'#edadd4'},
 {id:'cafe',name:'Moon Café',icon:'☕',x:5,y:5,color:'#eac093'},
 {id:'park',name:'Whisper Park',icon:'🌳',x:9,y:5,color:'#b6dbad'},
 {id:'shelter',name:'Creature Shelter',icon:'🐾',x:1,y:9,color:'#b6dcd1'},
 {id:'arcade',name:'Tiny Arcade',icon:'🎮',x:5,y:9,color:'#c6b1ed'},
 {id:'market',name:'Night Market',icon:'🌙',x:9,y:9,color:'#bda4dd'}
];
const outfits=[['Everyday Clothes',0,'🟣'],['Pumpkin Hoodie',35,'🎃'],['Bat Cape',60,'🦇'],['Star Pajamas',45,'⭐'],['Mushroom Hat',75,'🍄'],['Ghost Sheet',90,'👻'],['Rainbow Coat',110,'🌈'],['Detective Coat',140,'🕵️'],['Moon Crown',220,'🌙'],['Royal Oddball',350,'👑']];
const furniture=[['Old Bed',0,'🛏️'],['Cloud Lamp',35,'☁️'],['Pumpkin Rug',50,'🎃'],['Book Tower',65,'📚'],['Bubble Chair',80,'🫧'],['Moon Window',110,'🌙'],['Glow Aquarium',160,'🐠'],['Mini Castle',240,'🏰'],['Secret Portal',400,'🌀']];
const pets=[['Mothball',0,'🦋'],['Wobble',55,'🐸'],['Noodle',95,'🐍'],['Pebble',150,'🪨'],['Spooklet',215,'👻'],['Starbun',320,'🐰']];
const defaultState=()=>({version:1,name:'',skin:0,hair:0,color:0,x:2,y:3,day:1,hour:8,cash:35,energy:8,maxEnergy:8,skills:{wit:0,craft:0,brave:0},xp:0,level:1,stamps:0,ownedOutfits:[0],worn:0,ownedFurniture:[0],placed:[0],ownedPets:[0],pet:0,finds:[],achievements:[],daily:{day:1,actions:{}},logs:['Welcome to Odd Little Town!']});
let s;try{s=JSON.parse(localStorage.getItem(KEY))||defaultState();if(s.version!==1)throw 0}catch{s=defaultState()}
const $=id=>document.getElementById(id), esc=t=>String(t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function save(){try{localStorage.setItem(KEY,JSON.stringify(s))}catch{}}
function labelTime(){return ((s.hour+11)%12+1)+(s.hour<12?' AM':' PM')}
function level(){while(s.xp>=s.level*45){s.xp-=s.level*45;s.level++;s.maxEnergy++;s.energy=Math.min(s.maxEnergy,s.energy+2);log('Level '+s.level+'! Maximum energy +1.')}}
function log(t){s.logs.unshift(t);s.logs=s.logs.slice(0,12)}
function badge(id,text){if(!s.achievements.includes(id)){s.achievements.push(id);s.stamps++;log('⭐ New badge: '+text+'! +1 stamp')}}
function check(){if(s.day>=7)badge('week','First Week');if(s.cash>=250)badge('saver','Big Saver');if(s.level>=5)badge('level5','Level Five');if(s.ownedOutfits.length>=5)badge('fashion','Fashion Collector');if(s.ownedPets.length>=4)badge('pets','Creature Friend');if(s.ownedFurniture.length>=5)badge('room','Room Designer');if(s.skills.wit>=8)badge('wit','Bright Spark');if(s.skills.craft>=8)badge('craft','Crafty Hands');if(s.skills.brave>=8)badge('brave','Brave Heart');if(s.finds.length>=8)badge('finds','Curious Explorer')}
function refresh(){check();save();$('status').innerHTML=`<span>📅 Day ${s.day} · ${labelTime()}</span><span>💰 ${s.cash}</span><span>⚡ ${s.energy}/${s.maxEnergy}</span><span>⭐ ${s.stamps} badges</span>`;let b=at();$('place').textContent=b?b.icon+' '+b.name+' · Tap ENTER':'Walk around town and enter a building.';$('enter').disabled=!b;draw()}
function at(){return buildings.find(b=>s.x>=b.x&&s.x<b.x+2&&s.y>=b.y&&s.y<b.y+2)}
function move(dx,dy){if($('overlay').classList.contains('show'))return;s.x=Math.max(0,Math.min(N-1,s.x+dx));s.y=Math.max(0,Math.min(N-1,s.y+dy));refresh()}
const colors=['#b77a62','#e1ad87','#f3d4a8','#795146','#a57255'],hair=['#30233e','#8a543e','#e7c25e','#b65b8e','#eae7e0'],coats=['#9c78c3','#eb8aa4','#74b6ae','#e7ad62','#8aa4db'];
function draw(){X.fillStyle='#a8c4b7';X.fillRect(0,0,480,480);for(let i=0;i<N;i++){for(let j=0;j<N;j++){X.fillStyle=(i%4===3||j%4===3)?'#e3d8c6':'#b8d0b7';X.fillRect(i*T,j*T,T,T);X.strokeStyle='#ffffff31';X.strokeRect(i*T,j*T,T,T)}}for(let b of buildings){let x=b.x*T,y=b.y*T;X.fillStyle='#312648';X.fillRect(x-3,y+8,86,78);X.fillStyle=b.color;X.fillRect(x,y+5,80,71);X.fillStyle='#fff3d5';X.beginPath();X.moveTo(x-4,y+8);X.lineTo(x+40,y-9);X.lineTo(x+84,y+8);X.fill();X.textAlign='center';X.font='30px system-ui';X.fillText(b.icon,x+40,y+46);X.fillStyle='#312648';X.font='bold 10px system-ui';X.fillText(b.name,x+40,y+67)}let px=s.x*T+20,py=s.y*T+23;X.fillStyle='#30233e';X.beginPath();X.arc(px,py-6,16,0,7);X.fill();X.fillStyle=colors[s.skin]||colors[0];X.beginPath();X.arc(px,py-7,13,0,7);X.fill();X.fillStyle=hair[s.hair]||hair[0];X.fillRect(px-12,py-20,24,7);X.fillStyle='#30233e';X.fillRect(px-6,py-7,3,3);X.fillRect(px+4,py-7,3,3);X.fillStyle=coats[s.color]||coats[0];X.fillRect(px-12,py+8,24,13);X.strokeStyle='white';X.lineWidth=2;X.strokeRect(px-15,py-24,30,47)}
function open(html){$('panelBody').innerHTML=html;$('overlay').classList.add('show')}
function close(){$('overlay').classList.remove('show')}
function head(title,detail=''){return `<h2>${title}</h2>${detail?`<p>${detail}</p>`:''}<div id="message"></div>`}
function tell(t){let n=$('message');if(n)n.innerHTML=`<div class="notice">${esc(t)}</div>`;refresh()}
function option(title,detail,fn,disabled=false){return `<button class="option" ${disabled?'disabled':''} onclick="${fn}">${title}<small>${detail}</small></button>`}
function spend(hours,energy,cost=0){if(s.energy<energy)return 'Not enough energy. Go home and sleep.';if(s.cash<cost)return 'Not enough money.';if(s.hour+hours>24)return 'Too late tonight. Go home and sleep.';s.energy-=energy;s.cash-=cost;s.hour+=hours;if(s.hour===24){s.hour=0;s.day++;s.daily={day:s.day,actions:{}}}return ''}
function action(kind){let d=s.daily.actions;let defs={work:{time:3,energy:2,pay:16+s.skills.wit*3,stat:'wit',xp:10},deliver:{time:2,energy:2,pay:13+s.skills.brave*2,stat:'brave',xp:8},craft:{time:2,energy:2,pay:11+s.skills.craft*3,stat:'craft',xp:8},study:{time:2,energy:2,cost:8,stat:'wit',gain:2,xp:12},workshop:{time:2,energy:2,cost:8,stat:'craft',gain:2,xp:12},explore:{time:2,energy:2,stat:'brave',gain:2,xp:12},play:{time:1,energy:1,cost:3,pay:5+s.level*2,xp:5},wander:{time:1,energy:1,xp:6},snack:{time:1,energy:0,cost:8,gainEnergy:3},festival:{time:2,energy:1,cost:12,xp:15}};let a=defs[kind];if(!a)return;let err=spend(a.time,a.energy,a.cost||0);if(err)return tell(err);s.cash+=a.pay||0;s.xp+=a.xp||0;if(a.stat)s.skills[a.stat]+=a.gain||1;if(a.gainEnergy)s.energy=Math.min(s.maxEnergy,s.energy+a.gainEnergy);d[kind]=(d[kind]||0)+1;let msgs={work:'You sorted peculiar parcels.',deliver:'You delivered a letter to an invisible neighbor.',craft:'You made a wonderfully lopsided trinket.',study:'You learned why the moon looks so suspicious.',workshop:'Your creation is only slightly haunted.',explore:'You explored the whispering trees.',play:'Your arcade tickets turned into coins.',wander:'You found something interesting in the square.',snack:'A warm snack restored your energy.',festival:'You joined the town’s tiny celebration.'};if(kind==='wander'||kind==='explore'){let finds=['Bent Key','Blue Feather','Moon Button','Odd Sock','Tiny Bell','Silver Leaf','Glow Pebble','Paper Crown','Clockwork Tooth','Polka Dot Shell','Little Map','Star Sticker'];let available=finds.filter(f=>!s.finds.includes(f));if(available.length&&Math.random()<.58){let f=available[Math.floor(Math.random()*available.length)];s.finds.push(f);msgs[kind]+=' Found: '+f+'!'}}if(kind==='festival'&&s.day%7===0){s.cash+=20;msgs[kind]+=' A festival prize: 20 coins!'}level();log(msgs[kind]);tell(msgs[kind])}
function sleep(){if(at()?.id!=='home')return;let was=s.hour;s.day++;s.hour=8;s.energy=s.maxEnergy;s.daily={day:s.day,actions:{}};let bonus=s.placed.includes(6)?5:0;s.cash+=bonus;log('You slept '+(was>=8?'until morning.':'through the night.')+(bonus?' The aquarium earned 5 coins.':''));show('home')}
function buy(type,i){let data=type==='outfit'?outfits:type==='furniture'?furniture:pets;let key=type==='outfit'?'ownedOutfits':type==='furniture'?'ownedFurniture':'ownedPets';if(s[key].includes(i))return tell('Already in your collection.');if(s.cash<data[i][1])return tell('Not enough coins.');s.cash-=data[i][1];s[key].push(i);s.xp+=8;level();log('Collected '+data[i][0]+'!');show(type==='pet'?'shelter':type==='furniture'?'shop':'shop')}
function show(id){if(id==='home'){open(head('🏠 Your Room','Rest and arrange your favorite finds.')+`<div class="avatar">${outfits[s.worn][2]} ${pets[s.pet][2]}</div><p>Your room: ${s.placed.map(i=>furniture[i][2]+' '+furniture[i][0]).join(' · ')}</p><div class="options">${option('Sleep until 8 AM','Restore all energy and start a new day.','sleep()')}${option('Decorate room','Display up to four things you own.','show("room")')}${option('Dress up','Change your look anytime.','show("character")')}</div>`)}
else if(id==='square')open(head('🎪 Town Square','There is always something a little strange going on.')+`<div class="options">${option('Wander around','1 hour · 1 energy · discover curious objects · +6 XP','action("wander")')}${option('Sort peculiar parcels','3 hours · 2 energy · earn '+(16+s.skills.wit*3)+' coins · Wit +1','action("work")')}${option('Check goals','See what you can work toward.','show("goals")')}</div>`);
else if(id==='school')open(head('📚 Curious School','Learn things that help you earn more.')+`<div class="options">${option('Study strange facts','2 hours · 2 energy · 8 coins · Wit +2 · +12 XP','action("study")')}${option('Craft workshop','2 hours · 2 energy · 8 coins · Craft +2 · +12 XP','action("workshop")')}</div>`);
else if(id==='shop'){let list=outfits.map((v,i)=>option(v[2]+' '+esc(v[0]),s.ownedOutfits.includes(i)?'Owned · choose in Character':v[1]+' coins',`buy("outfit",${i})`,s.ownedOutfits.includes(i))).join('');let furn=furniture.map((v,i)=>option(v[2]+' '+esc(v[0]),s.ownedFurniture.includes(i)?'Owned · place in Room':v[1]+' coins',`buy("furniture",${i})`,s.ownedFurniture.includes(i))).join('');open(head('🛍️ Oddities Shop','New things to wear and display.')+'<h3>Clothes and accessories</h3><div class="options">'+list+'</div><h3>Furniture</h3><div class="options">'+furn+'</div>')}
else if(id==='cafe')open(head('☕ Moon Café','Small jobs and suspiciously delicious food.')+`<div class="options">${option('Make curious snacks','2 hours · 2 energy · earn '+(11+s.skills.craft*3)+' coins · Craft +1','action("craft")')}${option('Eat a warm snack','1 hour · 8 coins · restore 3 energy','action("snack")')}</div>`);
else if(id==='park')open(head('🌳 Whisper Park','Friendly trees. Mostly.')+`<div class="options">${option('Explore the winding path','2 hours · 2 energy · Brave +2 · chance to find something','action("explore")')}${option('Deliver odd mail','2 hours · 2 energy · earn '+(13+s.skills.brave*2)+' coins · Brave +1','action("deliver")')}</div>`);
else if(id==='shelter')open(head('🐾 Creature Shelter','Adopt a pet, then choose it as your companion.')+'<div class="options">'+pets.map((v,i)=>option(v[2]+' '+esc(v[0]),s.ownedPets.includes(i)?'Adopted · select in Collection':v[1]+' coins',`buy("pet",${i})`,s.ownedPets.includes(i))).join('')+'</div>');
else if(id==='arcade')open(head('🎮 Tiny Arcade','Play for tickets. The cashier accepts them as coins.')+`<div class="options">${option('Play the cabinets','1 hour · 1 energy · 3 coins · earn '+(5+s.level*2)+' coins · +5 XP','action("play")')}</div>`);
else if(id==='market')open(head('🌙 Night Market','A small celebration under the moon.')+`<p>${s.hour>=17||s.hour<6?'The market is open!':'Come back after 5 PM for the festival.'}</p><div class="options">${option('Join the tiny festival','After 5 PM · 2 hours · 1 energy · 12 coins · +15 XP. Day 7, 14… prize: 20 coins.','action("festival")',s.hour<17||s.hour>22)}</div>`);
else if(id==='help')open(head('How to Play','Make an odd character and explore at your own pace.')+'<p>Use the arrow buttons to walk. Stand on a building and tap ENTER to see what you can do there. Activities use hours and energy; sleep at Your Room to begin the next day.</p><p>Earn coins from jobs, train Wit, Craft, and Brave, collect pets and clothes, decorate your room, and earn badges. The game saves automatically on this device.</p>');else if(id==='character')character();else if(id==='room')room();else if(id==='collection')collection();else if(id==='goals')goals();else if(id==='menu')menu()}
function character(){open(head('🧍 '+esc(s.name||'Your Character'),'Create a look that feels like yours. Changes are free.')+`<div class="avatar">${outfits[s.worn][2]} 😊</div><p>Level ${s.level} · ${s.xp}/${s.level*45} XP</p><div class="pill">🧠 Wit ${s.skills.wit} · 🎨 Craft ${s.skills.craft} · 💜 Brave ${s.skills.brave}</div><label>Name <input type="text" id="newName" maxlength="16" value="${esc(s.name)}"></label><p><button onclick="rename()">Save name</button></p><h3>Skin tone</h3><div class="swatches">${colors.map((c,i)=>`<button title="Skin tone ${i+1}" style="background:${c};outline:${s.skin===i?'3px solid #8051aa':'none'}" onclick="setLook('skin',${i})"></button>`).join('')}</div><h3>Hair color</h3><div class="swatches">${hair.map((c,i)=>`<button title="Hair color ${i+1}" style="background:${c};outline:${s.hair===i?'3px solid #8051aa':'none'}" onclick="setLook('hair',${i})"></button>`).join('')}</div><h3>Outfit color</h3><div class="swatches">${coats.map((c,i)=>`<button title="Outfit color ${i+1}" style="background:${c};outline:${s.color===i?'3px solid #8051aa':'none'}" onclick="setLook('color',${i})"></button>`).join('')}</div><h3>What to wear</h3><div class="options">${s.ownedOutfits.map(i=>option(outfits[i][2]+' '+esc(outfits[i][0]),s.worn===i?'Wearing':'Tap to wear',`wear(${i})`)).join('')}</div><p><button onclick="shareCard()">Make a character card</button></p>`)}
function rename(){let v=$('newName').value.trim().replace(/[<>]/g,'').slice(0,16);s.name=v||'Oddball';show('character')}
function setLook(k,i){s[k]=i;show('character')}function wear(i){if(s.ownedOutfits.includes(i)){s.worn=i;show('character')}}
function room(){open(head('🏠 Decorate Your Room','Tap an item to place or remove it. Display up to four.')+`<div class="avatar">${s.placed.map(i=>furniture[i][2]).join(' ')}</div><p>${s.placed.map(i=>furniture[i][0]).join(' · ')}</p><div class="options">${s.ownedFurniture.map(i=>option(furniture[i][2]+' '+esc(furniture[i][0]),s.placed.includes(i)?'Displayed · tap to remove':'Tap to display',`place(${i})`)).join('')}</div>`)}
function place(i){if(s.placed.includes(i)){if(s.placed.length===1)return tell('Keep at least one thing in your room.');s.placed=s.placed.filter(x=>x!==i)}else if(s.placed.length>=4)return tell('Your room can display four things. Remove one first.');else s.placed.push(i);show('room')}
function collection(){open(head('📖 Your Collection',`Collected ${s.finds.length}/12 curious objects · ${s.ownedPets.length}/6 creatures.`)+`<div class="pill">Companion: ${pets[s.pet][2]} ${pets[s.pet][0]}</div><h3>Pets</h3><div class="options">${s.ownedPets.map(i=>option(pets[i][2]+' '+esc(pets[i][0]),s.pet===i?'Following you':'Tap to make your companion',`companion(${i})`)).join('')}</div><h3>Curious objects</h3><p>${s.finds.length?s.finds.map(esc).join(' · '):'Explore the square and park to find some.'}</p><h3>Badges</h3><p>${s.achievements.length?s.achievements.map(esc).join(' · '):'Your first badge is waiting!'}</p>`)}
function companion(i){if(s.ownedPets.includes(i)){s.pet=i;show('collection')}}
function goals(){let g=[['Play for seven days',s.day+'/7'],['Save 250 coins',Math.min(250,s.cash)+'/250'],['Reach level 5',s.level+'/5'],['Own five outfits',s.ownedOutfits.length+'/5'],['Adopt four pets',s.ownedPets.length+'/4'],['Own five furniture items',s.ownedFurniture.length+'/5'],['Reach 8 Wit',s.skills.wit+'/8'],['Reach 8 Craft',s.skills.craft+'/8'],['Reach 8 Brave',s.skills.brave+'/8'],['Find eight curious objects',s.finds.length+'/8']];open(head('⭐ Goals','Earn one badge for each goal. There is no final day.')+g.map(([n,p])=>`<div class="card"><b>${esc(n)}</b><br>${esc(p)}</div>`).join('')+'<h3>Recent adventures</h3>'+s.logs.map(t=>`<p class="muted">• ${esc(t)}</p>`).join(''))}
function menu(){open(head('☰ Game Menu','Your game saves automatically on this device and browser.')+`<div class="options">${option('How to play','Walk onto a building and press ENTER. Activities take hours and energy. Sleep at home to start a new day.','show("help")')}${option('Export save','Download a backup file you can import later.','exportSave()')}${option('Import save','Choose a backup file from your iPhone.','importPrompt()')}${option('Start over','Requires typing RESET.','resetPrompt()')}</div>`)}
function exportSave(){save();let blob=new Blob([JSON.stringify(s,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='odd-little-town-save.json';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),60000);tell('Save downloaded. Keep the file somewhere safe.')}
function importPrompt(){open(head('Import a save','This replaces the save currently on this device.')+'<input id="importFile" type="file" accept=".json,application/json"><p><button onclick="importSave()">Import selected file</button></p>')}
async function importSave(){let file=$('importFile').files[0];if(!file)return tell('Choose a file first.');try{let o=JSON.parse(await file.text());if(o.version!==1||!o.skills||!Array.isArray(o.ownedPets)||!Number.isInteger(o.day)||!Number.isInteger(o.x)||!Number.isInteger(o.y)||o.x<0||o.x>=N||o.y<0||o.y>=N)throw 0;s=o;refresh();close()}catch{tell('That is not an Odd Little Town save file.')}}
function resetPrompt(){open(head('Start over','This deletes the current game on this device. Export a backup first if you want to keep it.')+'<p>Type RESET to continue:</p><input id="resetText" type="text" autocomplete="off"><p><button onclick="resetSave()">Start a new game</button></p>')}
function resetSave(){if($('resetText').value!=='RESET')return tell('Type RESET exactly.');s=defaultState();refresh();show('character')}
function shareCard(){let c=document.createElement('canvas');c.width=700;c.height=900;let x=c.getContext('2d');x.fillStyle='#312648';x.fillRect(0,0,700,900);x.fillStyle='#f9e3a1';x.beginPath();x.arc(545,160,88,0,7);x.fill();x.fillStyle='#e8cbe7';x.fillRect(40,340,620,490);x.fillStyle='#312648';x.font='bold 50px system-ui';x.fillText('ODD LITTLE TOWN',54,85);x.font='bold 48px system-ui';x.fillText((s.name||'Oddball').slice(0,16),65,420);x.fillStyle=colors[s.skin];x.beginPath();x.arc(350,250,89,0,7);x.fill();x.fillStyle=hair[s.hair];x.fillRect(266,151,168,39);x.fillStyle='#312648';x.beginPath();x.arc(320,247,8,0,7);x.arc(382,247,8,0,7);x.fill();x.fillStyle=coats[s.color];x.fillRect(260,336,180,45);x.font='74px system-ui';x.fillText(outfits[s.worn][2]+' '+pets[s.pet][2],70,535);x.fillStyle='#312648';x.font='30px system-ui';x.fillText('Level '+s.level+'  •  '+s.stamps+' badges',70,612);x.fillText('Wit '+s.skills.wit+'  •  Craft '+s.skills.craft+'  •  Brave '+s.skills.brave,70,668);x.font='26px system-ui';x.fillText('My wonderfully odd character',70,760);let a=document.createElement('a');a.download='my-odd-little-town-character.png';a.href=c.toDataURL('image/png');document.body.append(a);a.click();a.remove();tell('Character card made. Check your downloads, or use Share on the image.')}
function interact(){let b=at();if(b)show(b.id)}
$('enter').onclick=interact;$('close').onclick=close;$('overlay').addEventListener('click',e=>{if(e.target===$('overlay'))close()});$('menuButton').onclick=()=>show('menu');document.querySelectorAll('[data-dir]').forEach(b=>b.onclick=()=>{let d={up:[0,-1],down:[0,1],left:[-1,0],right:[1,0]}[b.dataset.dir];move(...d)});document.querySelectorAll('[data-panel]').forEach(b=>b.onclick=()=>show(b.dataset.panel));C.addEventListener('click',e=>{let r=C.getBoundingClientRect(),x=Math.floor((e.clientX-r.left)/r.width*N),y=Math.floor((e.clientY-r.top)/r.height*N);let b=at();if(b&&x>=b.x&&x<b.x+2&&y>=b.y&&y<b.y+2)interact()});window.addEventListener('keydown',e=>{if(e.target.tagName==='INPUT')return;let d={ArrowUp:[0,-1],ArrowDown:[0,1],ArrowLeft:[-1,0],ArrowRight:[1,0],w:[0,-1],s:[0,1],a:[-1,0],d:[1,0]}[e.key];if(d){e.preventDefault();move(...d)}else if(e.key==='Enter')interact();else if(e.key==='Escape')close()});
refresh();if(!s.name){open(head('Welcome to Odd Little Town!','Make a character, explore the town, collect strange things, and make a room of your own. Every friend gets their own adventure.')+'<p>What should we call your character?</p><input id="startName" type="text" maxlength="16" placeholder="Your character’s name"><p><button onclick="start()">Let’s play!</button></p>')}
function start(){s.name=$('startName').value.trim().replace(/[<>]/g,'').slice(0,16)||'Oddball';save();show('character')}
</script></body></html>
